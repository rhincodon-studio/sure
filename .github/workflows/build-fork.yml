# ============================================================================
# Fork Build Workflow
# ============================================================================
#
# Build and push Docker image for rhincodon-studio/sure fork
# Uses the shared kaniko build template
#
# ============================================================================

name: Build Fork Image

on:
  push:
    branches: [main]
    tags:
      - v*
    paths-ignore:
      - 'charts/**'
      - 'mobile/**'
      - '*.md'
      - 'docs/**'

  # Manual trigger: use the native branch/tag selector in the "Run workflow"
  # dialog to choose which ref to build. The shared build template checks out
  # whatever ref triggered the run, so no custom `ref` input is needed.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: rhincodon-studio/public-devops-templates/.github/workflows/build-kaniko-tpl.yml@v1.5.4
    with:
      repository: rhincodon-studio/sure
      container_repository: rhincodon-studio/sure
      working_directory: "."
      dockerfile_path: "Dockerfile"
      registry: "ghcr"
      runs_on: '["arc-runner-set"]'
    secrets: inherit
